# /etc/nginx/sites-available/arcstones.xyz  (HTTPS is added by: certbot --nginx -d arcstones.xyz)
server {
    listen 80;
    listen [::]:80;
    server_name arcstones.xyz;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s; # the guardian's verdict can take a few seconds
    }
}
